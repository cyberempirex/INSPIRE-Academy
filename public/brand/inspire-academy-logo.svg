<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B6CB0" />
      <stop offset="100%" stop-color="#1B365D" />
    </linearGradient>
    <linearGradient id="bookBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bookGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48BB78" />
      <stop offset="100%" stop-color="#2F855A" />
    </linearGradient>
  </defs>

  <!-- Central Globe -->
  <g id="globe-layer" transform="translate(250, 260)">
    <!-- Globe Base Sphere -->
    <circle cx="0" cy="0" r="145" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3" />
    
    <!-- Blue Ocean Shapes / Continents -->
    <path d="M-85 -115 C-40 -130, 20 -135, 75 -110 C60 -80, 20 -70, -30 -60 C-60 -50, -80 -80, -85 -115 Z" fill="#2563EB" opacity="0.95" />
    <path d="M-135 -40 C-145 20, -110 80, -60 115 C-50 90, -70 50, -90 10 C-105 -20, -120 -35, -135 -40 Z" fill="#2563EB" opacity="0.95" />
    <path d="M25 -40 C60 -70, 115 -60, 140 -10 C145 40, 120 100, 75 130 C45 110, 60 70, 50 30 C40 -10, 30 -30, 25 -40 Z" fill="#2563EB" opacity="0.95" />
    <path d="M-40 20 C-10 10, 20 25, 25 55 C10 80, -25 85, -45 60 C-50 40, -45 30, -40 20 Z" fill="#2563EB" opacity="0.95" />
    
    <!-- Longitude / Latitude Arc Lines -->
    <ellipse cx="0" cy="0" rx="75" ry="145" fill="none" stroke="#93C5FD" stroke-width="1.5" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="145" ry="55" fill="none" stroke="#93C5FD" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Left Green Ascending Figure -->
  <g id="green-figure">
    <!-- Head -->
    <circle cx="135" cy="225" r="28" fill="#22C55E" />
    <!-- Dynamic Body Swoop -->
    <path d="M70 260 C110 240, 160 250, 195 315 C215 365, 230 415, 240 435 C200 400, 160 330, 120 280 C95 270, 80 265, 70 260 Z" fill="#16A34A" />
    <path d="M110 250 C145 285, 195 340, 235 430 C190 360, 155 310, 105 270 Z" fill="#22C55E" />
  </g>

  <!-- Central Red Ascending Figure (Primary Hero Element) -->
  <g id="red-figure">
    <!-- Head -->
    <circle cx="230" cy="100" r="35" fill="#EF4444" />
    
    <!-- Left Arm / Swoop -->
    <path d="M125 105 C160 120, 205 150, 240 230 C200 170, 165 140, 125 105 Z" fill="#DC2626" />
    
    <!-- Main Upward Leaping Body & High-Reaching Right Arm -->
    <path d="M260 20 C280 80, 295 160, 305 220 C270 300, 255 380, 245 440 C235 370, 215 280, 190 200 C215 150, 240 80, 260 20 Z" fill="#EF4444" />
    
    <!-- Back Curve / Wing Accent -->
    <path d="M260 20 C275 90, 290 170, 300 230 C280 180, 265 100, 260 20 Z" fill="#B91C1C" />
  </g>

  <!-- Open Book Ribbon & Banner Foundation (Bottom) -->
  <g id="book-banner" transform="translate(0, 375)">
    <!-- Bottom Shadow / Trim -->
    <path d="M25 45 C120 25, 200 65, 250 85 C300 65, 380 25, 475 45 L450 80 C365 60, 290 85, 250 100 C210 85, 135 60, 50 80 Z" fill="#0B132B" />

    <!-- Lower Green Trim Ribbon -->
    <path d="M45 42 C140 25, 210 58, 250 78 C290 58, 360 25, 455 42 L440 68 C355 52, 290 75, 250 90 C210 75, 145 52, 60 68 Z" fill="url(#bookGreenGrad)" />

    <!-- Upper Dark Blue Book Wings -->
    <!-- Left Wing -->
    <path d="M5 25 C100 -5, 185 20, 248 58 L248 68 C185 30, 100 8, 20 40 Z" fill="url(#bookBlueGrad)" stroke="#1D4ED8" stroke-width="1.5" />
    <!-- Right Wing -->
    <path d="M495 25 C400 -5, 315 20, 252 58 L252 68 C315 30, 400 8, 480 40 Z" fill="url(#bookBlueGrad)" stroke="#1D4ED8" stroke-width="1.5" />

    <!-- Central Book Spine / Page Divider -->
    <path d="M250 48 L250 88" stroke="#60A5FA" stroke-width="2.5" />

    <!-- Typography: INSPIRE (Left Blue Wing) -->
    <text x="135" y="28" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="3" transform="rotate(-6 135 28)">INSPIRE</text>

    <!-- Typography: ACADEMY (Right Blue Wing) -->
    <text x="365" y="28" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" letter-spacing="3" transform="rotate(6 365 28)" text-anchor="middle">ACADEMY</text>

    <!-- Typography: Estd. 2019 (Left Green Banner) -->
    <text x="150" y="60" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="1.5" text-anchor="middle">Estd. 2019</text>

    <!-- Typography: SIMLA (Right Green Banner) -->
    <text x="350" y="60" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="2" text-anchor="middle">SIMLA</text>
  </g>
</svg>
